name: Android debug APK

# Builds a debug APK on every push (and on demand) using GitHub's free hosted
# runners: no paid service, no self-hosting, no secrets required.
on:
  push:
    branches: ["**"]        # every branch; tags are ignored
  pull_request:             # so pull requests get a build too
  workflow_dispatch:        # and the "Run workflow" button

# The job only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the previous run, which keeps the
# free minutes for builds that are still relevant.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The project compiles against Java 17 (see app/build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle          # caches ~/.gradle between runs

      # Installs the command line tools, accepts the SDK licences and makes sure
      # the platform/build-tools this project targets are present.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      # Finds the Gradle root and the Android application module instead of
      # assuming a fixed layout, so the workflow keeps working if the project is
      # moved into a subdirectory or the module is renamed.
      - name: Detect the Android/Gradle project
        id: detect
        run: |
          set -euo pipefail

          # --- 1. Gradle root: the shallowest directory with settings.gradle(.kts)
          root=""
          while IFS= read -r file; do
            dir=$(dirname "$file")
            if [ -z "$root" ] || [ "${#dir}" -lt "${#root}" ]; then root="$dir"; fi
          done < <(git ls-files | grep -E '(^|/)settings\.gradle(\.kts)?$' || true)

          if [ -z "$root" ]; then
            echo "::error::No settings.gradle(.kts) found - is this a Gradle project?"
            exit 1
          fi

          # --- 2. Application module: the module that applies com.android.application
          module=""
          while IFS= read -r build_file; do
            if grep -qE 'com\.android\.(application|dynamic-feature)' "$build_file"; then
              module=$(dirname "$build_file")
              break
            fi
          done < <(git ls-files | grep -E '(^|/)build\.gradle(\.kts)?$' || true)

          # Fall back to the conventional module name.
          if [ -z "$module" ] && [ -f "$root/app/build.gradle.kts" ]; then
            module="$root/app"
          fi
          if [ -z "$module" ]; then
            echo "::error::No Android application module (com.android.application) found"
            exit 1
          fi

          # --- 3. Derive the Gradle task and the APK output directory
          if [ "$module" = "$root" ]; then
            task="assembleDebug"
            sub=""
          else
            sub=${module#"$root"/}
            task=":${sub//\//:}:assembleDebug"
          fi
          apk_dir="$module/build/outputs/apk/debug"

          {
            echo "gradle_root=$root"
            echo "module_path=$module"
            echo "task=$task"
            echo "apk_dir=$apk_dir"
          } >> "$GITHUB_OUTPUT"

          echo "Gradle root  : $root"
          echo "App module   : $module"
          echo "Gradle task  : $task"
          echo "APK directory: $apk_dir"

      - name: Build the debug APK
        working-directory: ${{ steps.detect.outputs.gradle_root }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version
          # The full output is kept so that the diagnostics step below can turn
          # compiler errors into annotations that show up on the run page.
          ./gradlew ${{ steps.detect.outputs.task }} --console=plain --stacktrace \
            2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      # Turns the interesting part of a failed build into check annotations, so
      # the exact compiler error is visible without downloading the raw log.
      - name: Publish build diagnostics
        if: failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gradle-build.log"
          if [ ! -s "$log" ]; then
            echo "No Gradle output was captured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$log" "$GITHUB_STEP_SUMMARY" <<'PY'
          import re, sys

          log_path, summary_path = sys.argv[1], sys.argv[2]
          lines = open(log_path, errors="replace").read().splitlines()

          def keep(patterns, source):
              return [l for l in source if any(re.search(p, l) for p in patterns)]

          errors = keep([r"^\s*e: ", r"^\s*e:file"], lines)          # Kotlin errors
          problems = keep(
              [
                  r"(?i)error:",
                  r"(?i)^\s*FAILURE:",
                  r"(?i)what went wrong",
                  r"(?i)execution failed for task",
                  r"(?i)caused by:",
                  r"(?i)could not (resolve|find|determine|download|create|load|open)",
                  r"(?i)^\s*\* try:",
                  r"^\s*>\s.*FAILED",
                  r"(?i)unsupported class file",
              ],
              lines,
          )
          selected = errors or problems or lines[-250:]

          # Keep insertion order, drop duplicates, and cap the volume.
          seen, uniq = set(), []
          for line in selected:
              line = line.rstrip()
              if line and line not in seen:
                  seen.add(line)
                  uniq.append(line)
          text = "\n".join(uniq)[:48000]

          chunk_size = 4800
          chunks = [text[i:i + chunk_size] for i in range(0, len(text), chunk_size)][:10]
          for index, chunk in enumerate(chunks, 1):
              message = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Build failed ({index}/{len(chunks)})::{message}")

          if not chunks:
              print("::error title=Build failed::The Gradle build failed; see the run log.")

          with open(summary_path, "a") as summary:
              summary.write("### Debug APK build failed\n\n")
              summary.write(f"First {len(uniq)} relevant log line(s):\n\n")
              summary.write("```\n" + text[:60000] + "\n```\n")
          PY

      # Gives the artefact a recognisable file name and fails loudly if Gradle
      # reported success but produced nothing.
      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p artifacts
          apks=("${{ steps.detect.outputs.apk_dir }}"/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::The build succeeded but no APK was found in ${{ steps.detect.outputs.apk_dir }}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "artifacts/BubbleBlast-debug-${GITHUB_SHA::7}-$(basename "$apk")"
          done
          ls -lh artifacts
          {
            echo "### Debug APK built :white_check_mark:"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Module | \`${{ steps.detect.outputs.module_path }}\` |"
            echo "| Gradle task | \`${{ steps.detect.outputs.task }}\` |"
            for apk in artifacts/*.apk; do
              echo "| Artifact | \`$(basename "$apk")\` ($(du -h "$apk" | cut -f1)) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: bubble-blast-debug-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
